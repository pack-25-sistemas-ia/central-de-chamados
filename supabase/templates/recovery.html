<h2>Redefinir senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Escolher uma nova senha</a></p>
<p>O link expira em pouco tempo. Se você não pediu isso, ignore esta mensagem; sua senha continua a mesma.</p>
